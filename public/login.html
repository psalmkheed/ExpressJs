<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Login | MyStore</title>

      <style>
            * {
                  margin: 0;
                  padding: 0;
                  box-sizing: border-box;
            }

            body {
                  min-height: 100vh;
                  font-family: Arial, sans-serif;
                  background: linear-gradient(135deg, #eff6ff, #ffffff);
                  color: #222;
                  display: flex;
                  flex-direction: column;
            }

            /* NAVBAR */
            nav {
                  height: 70px;
                  background: #111827;
                  color: white;
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                  padding: 0 8%;
            }

            .logo {
                  font-size: 24px;
                  font-weight: bold;
            }

            nav ul {
                  list-style: none;
                  display: flex;
                  align-items: center;
                  gap: 25px;
            }

            nav a {
                  color: white;
                  text-decoration: none;
                  font-size: 15px;
            }

            nav a:hover {
                  color: #60a5fa;
            }

            .home-link {
                  display: flex;
                  align-items: center;
                  gap: 6px;
            }

            .signup-btn {
                  background: #2563eb;
                  padding: 10px 18px;
                  border-radius: 6px;
            }

            .signup-btn:hover {
                  background: #1d4ed8;
                  color: white;
            }

            /* PAGE */
            .page {
                  flex: 1;
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  padding: 50px 20px;
            }

            .login-wrapper {
                  width: 100%;
                  max-width: 470px;
            }

            .heading-group {
                  text-align: center;
                  margin-bottom: 25px;
            }

            .heading-icon {
                  width: 55px;
                  height: 55px;
                  margin: 0 auto 15px;
                  border-radius: 50%;
                  background: #dbeafe;
                  color: #2563eb;
                  display: flex;
                  align-items: center;
                  justify-content: center;
            }

            .heading-icon svg {
                  width: 28px;
                  height: 28px;
            }

            h1.login-heading {
                  font-size: 32px;
                  color: #111827;
                  margin-bottom: 8px;
            }

            h3.login-subheading {
                  color: #6b7280;
                  font-weight: 400;
                  font-size: 15px;
            }

            /* FORM */
            form {
                  width: 100%;
                  padding: 30px;
                  border-radius: 14px;
                  background: #fff;
                  box-shadow: 0 10px 35px rgba(17, 24, 39, 0.08);
                  border: 1px solid #eef2f7;
            }

            .input-group {
                  display: flex;
                  flex-direction: column;
                  gap: 7px;
                  width: 100%;
                  margin-bottom: 18px;
            }

            .input-group label {
                  color: #374151;
                  font-size: 14px;
                  font-weight: 600;
            }

            .input-wrapper {
                  position: relative;
            }

            .input-icon {
                  position: absolute;
                  left: 13px;
                  top: 50%;
                  transform: translateY(-50%);
                  color: #9ca3af;
                  display: flex;
                  pointer-events: none;
            }

            .input-icon svg {
                  width: 18px;
                  height: 18px;
            }

            .input-group input {
                  width: 100%;
                  padding: 12px 13px 12px 42px;
                  border-radius: 8px;
                  border: 1px solid #d1d5db;
                  font-size: 14px;
                  transition: border-color 0.2s, box-shadow 0.2s;
            }

            .input-group input::placeholder {
                  color: #b0b5bd;
            }

            .input-group input:focus {
                  outline: none;
                  border-color: #2563eb;
                  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            }

            /* MESSAGE */
            .message {
                  display: none;
                  padding: 11px 13px;
                  border-radius: 8px;
                  margin-bottom: 16px;
                  font-size: 13px;
                  line-height: 1.4;
            }

            .message.error {
                  display: block;
                  color: #b91c1c;
                  background: #fef2f2;
                  border: 1px solid #fecaca;
            }

            .message.success {
                  display: block;
                  color: #166534;
                  background: #f0fdf4;
                  border: 1px solid #bbf7d0;
            }

            /* BUTTON */
            form button {
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  gap: 8px;
                  background-color: #2563eb;
                  padding: 13px;
                  color: #fff;
                  font-size: 15px;
                  font-weight: bold;
                  border-radius: 8px;
                  width: 100%;
                  cursor: pointer;
                  border: none;
                  transition: all 0.25s ease;
            }

            form button:hover {
                  background-color: #1d4ed8;
                  box-shadow: 0 6px 15px rgba(37, 99, 235, 0.2);
            }

            form button:disabled {
                  opacity: 0.7;
                  cursor: not-allowed;
            }

            form button svg {
                  width: 18px;
                  height: 18px;
            }

            /* ACCOUNT LINK */
            .account {
                  text-align: center;
                  margin-top: 22px;
                  color: #6b7280;
                  font-size: 14px;
            }

            .account a {
                  font-weight: bold;
                  text-decoration: none;
                  color: #2563eb;
            }

            .account a:hover {
                  text-decoration: underline;
            }

            /* FOOTER */
            footer {
                  background: #0b1120;
                  color: #9ca3af;
                  text-align: center;
                  padding: 20px;
                  font-size: 13px;
            }

            /* MOBILE */
            @media screen and (max-width: 600px) {

                  nav {
                        padding: 0 5%;
                  }

                  nav ul li:not(:last-child) {
                        display: none;
                  }

                  .page {
                        padding: 35px 15px;
                  }

                  form {
                        padding: 25px 20px;
                  }

                  h1.login-heading {
                        font-size: 28px;
                  }
            }
      </style>
</head>


<body>

      <!-- NAVBAR -->
      <nav>

            <div class="logo">
                  MyStore
            </div>

            <ul>

                  <li>
                        <a href="/" class="home-link">

                              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">

                                    <path d="M3 10.5L12 3l9 7.5"></path>

                                    <path d="M5 9.5V21h14V9.5"></path>

                              </svg>

                              Home

                        </a>
                  </li>

                  <li>
                        <a href="./register.html" class="signup-btn">
                              Create Account
                        </a>
                  </li>

            </ul>

      </nav>


      <!-- LOGIN -->
      <main class="page">

            <div class="login-wrapper">

                  <div class="heading-group">

                        <div class="heading-icon">

                              <!-- Lock icon -->

                              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">

                                    <rect x="4" y="10" width="16" height="11" rx="2">
                                    </rect>

                                    <path d="M8 10V7a4 4 0 0 1 8 0v3">
                                    </path>

                              </svg>

                        </div>


                        <h1 class="login-heading">
                              Welcome Back
                        </h1>


                        <h3 class="login-subheading">
                              Login to access your MyStore account
                        </h3>

                  </div>


                  <form id="login-form">

                        <!-- EMAIL -->

                        <div class="input-group">

                              <label for="email">
                                    Email Address
                              </label>

                              <div class="input-wrapper">

                                    <input type="email" name="email" id="email" placeholder="johndoe@email.com">

                                    <span class="input-icon">

                                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                                stroke-linecap="round" stroke-linejoin="round">

                                                <rect x="3" y="5" width="18" height="14" rx="2">
                                                </rect>

                                                <path d="m3 7 9 6 9-6">
                                                </path>

                                          </svg>

                                    </span>

                              </div>

                        </div>


                        <!-- PASSWORD -->

                        <div class="input-group">

                              <label for="password">
                                    Password
                              </label>

                              <div class="input-wrapper">

                                    <input type="password" name="password" id="password"
                                          placeholder="Enter your password">

                                    <span class="input-icon">

                                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                                stroke-linecap="round" stroke-linejoin="round">

                                                <rect x="4" y="10" width="16" height="11" rx="2">
                                                </rect>

                                                <path d="M8 10V7a4 4 0 0 1 8 0v3">
                                                </path>

                                          </svg>

                                    </span>

                              </div>

                        </div>


                        <!-- MESSAGE -->

                        <p class="message" id="errorMsg"></p>


                        <!-- SUBMIT -->

                        <button type="submit" id="loginBtn">

                              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">

                                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4">
                                    </path>

                                    <polyline points="10 17 15 12 10 7">
                                    </polyline>

                                    <line x1="15" y1="12" x2="3" y2="12">
                                    </line>

                              </svg>

                              Sign In

                        </button>


                        <p class="account">

                              Don't have an account?

                              <a href="./register.html">
                                    Create one
                              </a>

                        </p>

                  </form>

            </div>

      </main>


      <!-- FOOTER -->

      <footer>

            &copy; 2026 MyStore. All rights reserved.

      </footer>


      <script>

            const form = document.getElementById("login-form");

            const email = document.getElementById("email");

            const password = document.getElementById("password");

            const message = document.getElementById("errorMsg");

            const loginBtn = document.getElementById("loginBtn");


            function showMessage(text, type = "error") {

                  message.textContent = text;

                  message.className = `message ${type}`;

            }


            form.addEventListener("submit", async (e) => {

                  e.preventDefault();


                  let isValid = true;


                  [email, password].forEach(field => {

                        if (field.value.trim() === "") {

                              field.style.borderColor = "#ef4444";

                              isValid = false;

                        } else {

                              field.style.borderColor = "#d1d5db";

                        }

                  });


                  if (!isValid) {

                        showMessage(
                              "Please fill in all required fields."
                        );

                        return;

                  }


                  const url =
                        "https://expressjs-n2cs.onrender.com/api/users/login";


                  try {

                        loginBtn.disabled = true;

                        loginBtn.textContent = "Signing In...";


                        const response = await fetch(url, {

                              method: "POST",

                              headers: {
                                    "Content-Type": "application/json"
                              },

                              body: JSON.stringify({

                                    email: email.value.trim(),

                                    password: password.value

                              })

                        });


                        const data = await response.json();

                                               


                        if (!response.ok) {

                              showMessage(
                                    data.error ||
                                    data.message ||
                                    "Unable to login."
                              );

                              loginBtn.disabled = false;

                              loginBtn.textContent = "Sign In";

                              return;

                        }


                        console.log("Login successful:", data);


                        /*
                         * Store JWT
                         *
                         * This assumes your backend returns:
                         *
                         * {
                         *     token: "your-jwt-token"
                         * }
                         */

                        if (data.token) {

                              localStorage.setItem(
                                    "token",
                                    data.token
                              );

                        }

                        if (data.user) {
                              localStorage.setItem("user", JSON.stringify(data.user));
                        }


                        showMessage(
                              "Login successful! Redirecting...",
                              "success"
                        );


                        setTimeout(() => {

                              window.location.href = "/dashboard.html";

                        }, 1500);


                  } catch (error) {

                        console.error(
                              "Request failed:",
                              error
                        );


                        showMessage(
                              "Unable to connect to the server."
                        );


                        loginBtn.disabled = false;

                        loginBtn.textContent = "Sign In";

                  }

            });

      </script>

</body>

</html>
