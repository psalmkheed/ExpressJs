<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>404 - Page Not Found</title>

      <style>
            * {
                  margin: 0;
                  padding: 0;
                  box-sizing: border-box;
            }

            body {
                  font-family: Arial, Helvetica, sans-serif;
                  min-height: 100vh;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  background: #f8fafc;
                  color: #0f172a;
            }

            .error-page {
                  width: 100%;
                  max-width: 600px;
                  padding: 40px 20px;
                  text-align: center;
            }

            .error-code {
                  font-size: clamp(100px, 20vw, 180px);
                  font-weight: 800;
                  line-height: 1;
                  color: #e2e8f0;
                  margin-bottom: 10px;
            }

            h1 {
                  font-size: 32px;
                  margin-bottom: 12px;
            }

            p {
                  font-size: 16px;
                  line-height: 1.6;
                  color: #64748b;
                  margin-bottom: 30px;
            }

            .home-button {
                  display: inline-block;
                  padding: 12px 24px;
                  border-radius: 8px;
                  background: #2563eb;
                  color: #ffffff;
                  text-decoration: none;
                  font-size: 15px;
                  font-weight: 600;
                  transition: background 0.2s ease;
            }

            .home-button:hover {
                  background: #1d4ed8;
            }
      </style>
</head>

<body>

      <main class="error-page">
            <div class="error-code">404</div>

            <h1>Page Not Found</h1>

            <p>
                  Sorry, the page you're looking for doesn't exist
                  or may have been moved.
            </p>

            <a href="/" class="home-button">
                  Back to Home
            </a>
      </main>

</body>
</html>
