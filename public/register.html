<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Create Account | MyStore</title>

      <style>
            * {
                  margin: 0;
                  padding: 0;
                  box-sizing: border-box;
            }

            body {
                  min-height: 100vh;
                  font-family: Arial, sans-serif;
                  background: linear-gradient(135deg, #eff6ff, #ffffff);
                  color: #222;
                  display: flex;
                  flex-direction: column;
            }

            /* NAVBAR */
            nav {
                  height: 70px;
                  background: #111827;
                  color: white;
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                  padding: 0 8%;
            }

            .logo {
                  font-size: 24px;
                  font-weight: bold;
            }

            nav ul {
                  list-style: none;
                  display: flex;
                  align-items: center;
                  gap: 25px;
            }

            nav a {
                  color: white;
                  text-decoration: none;
                  font-size: 15px;
            }

            nav a:hover {
                  color: #60a5fa;
            }

            .home-link {
                  display: flex;
                  align-items: center;
                  gap: 6px;
            }

            .login-btn {
                  background: #2563eb;
                  padding: 10px 18px;
                  border-radius: 6px;
            }

            .login-btn:hover {
                  background: #1d4ed8;
                  color: white;
            }

            /* PAGE */
            .page {
                  flex: 1;
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  padding: 50px 20px;
            }

            .register-wrapper {
                  width: 100%;
                  max-width: 470px;
            }

            .heading-group {
                  text-align: center;
                  margin-bottom: 25px;
            }

            .heading-icon {
                  width: 55px;
                  height: 55px;
                  margin: 0 auto 15px;
                  border-radius: 50%;
                  background: #dbeafe;
                  color: #2563eb;
                  display: flex;
                  align-items: center;
                  justify-content: center;
            }

            .heading-icon svg {
                  width: 28px;
                  height: 28px;
            }

            h1.reg-heading {
                  font-size: 32px;
                  color: #111827;
                  margin-bottom: 8px;
            }

            h3.reg-subheading {
                  color: #6b7280;
                  font-weight: 400;
                  font-size: 15px;
            }

            /* FORM */
            form {
                  width: 100%;
                  padding: 30px;
                  border-radius: 14px;
                  background: #fff;
                  box-shadow: 0 10px 35px rgba(17, 24, 39, 0.08);
                  border: 1px solid #eef2f7;
            }

            .input-group {
                  display: flex;
                  flex-direction: column;
                  gap: 7px;
                  width: 100%;
                  margin-bottom: 18px;
            }

            .input-group label {
                  color: #374151;
                  font-size: 14px;
                  font-weight: 600;
            }

            .input-wrapper {
                  position: relative;
            }

            .input-icon {
                  position: absolute;
                  left: 13px;
                  top: 50%;
                  transform: translateY(-50%);
                  color: #9ca3af;
                  display: flex;
                  pointer-events: none;
            }

            .input-icon svg {
                  width: 18px;
                  height: 18px;
            }

            .input-group input {
                  width: 100%;
                  padding: 12px 13px 12px 42px;
                  border-radius: 8px;
                  border: 1px solid #d1d5db;
                  font-size: 14px;
                  transition: border-color 0.2s, box-shadow 0.2s;
            }

            .input-group input::placeholder {
                  color: #b0b5bd;
            }

            .input-group input:focus {
                  outline: none;
                  border-color: #2563eb;
                  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            }

            .input-group input:focus+.input-icon {
                  color: #2563eb;
            }

            /* MESSAGE */
            .message {
                  display: none;
                  padding: 11px 13px;
                  border-radius: 8px;
                  margin-bottom: 16px;
                  font-size: 13px;
                  line-height: 1.4;
            }

            .message.error {
                  display: block;
                  color: #b91c1c;
                  background: #fef2f2;
                  border: 1px solid #fecaca;
            }

            .message.success {
                  display: block;
                  color: #166534;
                  background: #f0fdf4;
                  border: 1px solid #bbf7d0;
            }

            .input-error {
                  border: 1px solid red;
            }

            .input-success {
                  border: 1px solid green;
            }

            .error-message {
                  display: block;
                  color: red;
                  font-size: 12px;
                  margin-top: 4px;
            }

            /* BUTTON */
            form button {
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  gap: 8px;
                  background-color: #2563eb;
                  padding: 13px;
                  color: #fff;
                  font-size: 15px;
                  font-weight: bold;
                  border-radius: 8px;
                  width: 100%;
                  cursor: pointer;
                  border: none;
                  transition: all 0.25s ease;
            }

            form button:hover {
                  background-color: #1d4ed8;
                  box-shadow: 0 6px 15px rgba(37, 99, 235, 0.2);
            }

            form button:disabled {
                  opacity: 0.7;
                  cursor: not-allowed;
            }

            form button svg {
                  width: 18px;
                  height: 18px;
            }

            /* LOGIN LINK */
            .account {
                  text-align: center;
                  margin-top: 22px;
                  color: #6b7280;
                  font-size: 14px;
            }

            .account a {
                  font-weight: bold;
                  text-decoration: none;
                  color: #2563eb;
            }

            .account a:hover {
                  text-decoration: underline;
            }

            /* FOOTER */
            footer {
                  background: #0b1120;
                  color: #9ca3af;
                  text-align: center;
                  padding: 20px;
                  font-size: 13px;
            }

            /* MOBILE */
            @media screen and (max-width: 600px) {
                  nav {
                        padding: 0 5%;
                  }

                  nav ul li:not(:last-child) {
                        display: none;
                  }

                  .page {
                        padding: 35px 15px;
                  }

                  form {
                        padding: 25px 20px;
                  }

                  h1.reg-heading {
                        font-size: 28px;
                  }
            }
      </style>
</head>

<body>

      <!-- NAVBAR -->
      <nav>
            <div class="logo">MyStore</div>

            <ul>
                  <li>
                        <a href="/" class="home-link">
                              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M3 10.5L12 3l9 7.5"></path>
                                    <path d="M5 9.5V21h14V9.5"></path>
                              </svg>
                              Home
                        </a>
                  </li>

                  <li>
                        <a href="./login" class="login-btn">Sign In</a>
                  </li>
            </ul>
      </nav>


      <!-- REGISTRATION -->
      <main class="page">

            <div class="register-wrapper">

                  <div class="heading-group">

                        <div class="heading-icon">
                              <!-- User icon -->
                              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21a8 8 0 0 0-16 0"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                              </svg>
                        </div>

                        <h1 class="reg-heading">Create your account</h1>

                        <h3 class="reg-subheading">
                              Join MyStore and start shopping today
                        </h3>

                  </div>


                  <form id="reg-form">

                        <!-- NAME -->
                        <div class="input-group">
                              <label for="name">Full Name</label>

                              <div class="input-wrapper">

                                    <input type="text" name="name" id="name" placeholder="John Doe">

                                    <span class="input-icon">
                                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                                stroke-linecap="round" stroke-linejoin="round">
                                                <circle cx="12" cy="7" r="4"></circle>
                                                <path d="M5.5 21a6.5 6.5 0 0 1 13 0"></path>
                                          </svg>
                                    </span>

                              </div>
                              <small class="error-message" data-error="name"></small>
                        </div>
                        <!-- USERNAME -->
                        <div class="input-group">
                              <label for="username">Username</label>

                              <div class="input-wrapper">

                                    <input type="text" name="username" id="username" placeholder="john_doe">

                                    <span class="input-icon">
                                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                                stroke-linecap="round" stroke-linejoin="round">
                                                <circle cx="12" cy="7" r="4"></circle>
                                                <path d="M5.5 21a6.5 6.5 0 0 1 13 0"></path>
                                          </svg>
                                    </span>

                              </div>
                              <small class="error-message" data-error="username"></small>
                        </div>


                        <!-- EMAIL -->
                        <div class="input-group">
                              <label for="email">Email Address</label>

                              <div class="input-wrapper">

                                    <input type="email" name="email" id="email" placeholder="johndoe@email.com">

                                    <span class="input-icon">
                                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                                stroke-linecap="round" stroke-linejoin="round">
                                                <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                                                <path d="m3 7 9 6 9-6"></path>
                                          </svg>
                                    </span>

                              </div>
                              <small class="error-message" data-error="email"></small>
                        </div>


                        <!-- PASSWORD -->
                        <div class="input-group">
                              <label for="password">Password</label>

                              <div class="input-wrapper">

                                    <input type="password" name="password" id="password"
                                          placeholder="Enter your password">

                                    <span class="input-icon">
                                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                                stroke-linecap="round" stroke-linejoin="round">
                                                <rect x="4" y="10" width="16" height="11" rx="2"></rect>
                                                <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                                          </svg>
                                    </span>

                              </div>
                              <small class="error-message" data-error="password"></small>
                        </div>


                        <!-- MESSAGE -->
                        <p class="message" id="errorMsg"></p>


                        <!-- SUBMIT -->
                        <button type="submit" id="submitBtn">

                              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="9" cy="7" r="4"></circle>
                                    <line x1="19" y1="8" x2="19" y2="14"></line>
                                    <line x1="22" y1="11" x2="16" y2="11"></line>
                              </svg>

                              Create Account

                        </button>


                        <p class="account">
                              Already have an account?
                              <a href="./login">Sign in</a>
                        </p>

                  </form>

            </div>

      </main>


      <!-- FOOTER -->
      <footer>
            &copy; 2026 MyStore. All rights reserved.
      </footer>


      <script>

            const form = document.getElementById("reg-form");

            const name = document.getElementById("name");
            const username = document.getElementById("username");
            const email = document.getElementById("email");
            const password = document.getElementById("password");

            const errorMsg = document.getElementById("errorMsg");
            const submitBtn = document.getElementById("submitBtn");


            function showMessage(message, type = "error") {

                  errorMsg.textContent = message;

                  errorMsg.className = "message " + type;

            }

            const fields = [name, username, email, password];

            fields.forEach(field => {
                  field.addEventListener("input", () => {
                        validateField(field);
                  });
            });

            function validateField(field) {

                  const value = field.value.trim();

                  // Remove previous error
                  field.classList.remove("input-error", "input-success");

                  let message = "";

                  if (field === name) {
                        if (value === "") {
                              message = "Name is required.";
                        } else if (value.length < 3) {
                              message = "Name must be at least 3 characters.";
                        }
                  }

                  if (field === username) {
                        if (value === "") {
                              message = "Username is required.";
                        } else if (value.length < 3) {
                              message = "Username must be at least 3 characters.";
                        }
                  }

                  if (field === email) {
                        if (value === "") {
                              message = "Email is required.";
                        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
                              message = "Enter a valid email address.";
                        }
                  }

                  if (field === password) {
                        if (value === "") {
                              message = "Password is required.";
                        } else if (value.length < 8) {
                              message = "Password must be at least 8 characters.";
                        }
                  }

                  // Find the error element belonging to this input
                  const errorElement = document.querySelector(
                        `[data-error="${field.id}"]`
                  );

                  if (message) {
                        field.classList.add("input-error");

                        if (errorElement) {
                              errorElement.textContent = message;
                        }

                        return false;
                  }

                  field.classList.add("input-success");

                  if (errorElement) {
                        errorElement.textContent = "";
                  }

                  return true;
            }


            form.addEventListener("submit", async (e) => {

                  e.preventDefault();

                  let isValid = true;


                  [name, username, email, password].forEach(field => {

                        if (field.value.trim() === "") {

                              field.style.borderColor = "#ef4444";

                              isValid = false;

                        } else {

                              field.style.borderColor = "#d1d5db";

                        }

                  });


                  if (!isValid) {

                        showMessage("Please fill in all required fields.");

                        return;

                  }

// https://expressjs-n2cs.onrender.com/api/users/create-user
                  const url = "http://localhost:8888/api/users/create-user";


                  try {

                        submitBtn.disabled = true;

                        submitBtn.textContent = "Creating Account...";


                        const response = await fetch(url, {

                              method: "POST",

                              headers: {
                                    "Content-Type": "application/json"
                              },

                              body: JSON.stringify({

                                    name: name.value.trim(),

                                    username: username.value.trim(),

                                    email: email.value.trim(),

                                    password: password.value

                              })

                        });

                        const data = await response.json();

                        if (!response.ok) {

                              showMessage(
                                    data.error ||
                                    data.message ||
                                    "Unable to create account."
                              );

                              submitBtn.disabled = false;

                              submitBtn.textContent = "Create Account";

                              return;

                        }


                        console.log("Success:", data);


                        showMessage(
                              "Account created successfully! Redirecting to login...",
                              "success"
                        );


                        form.reset();


                        setTimeout(() => {
                              window.location.href = "/login";
                        }, 4000);


                  } catch (error) {

                        console.error("Request failed:", error);

                        showMessage(
                              "Unable to connect to the server."
                        );

                        submitBtn.disabled = false;

                        submitBtn.textContent = "Create Account";

                  }

            });

      </script>

</body>

</html>
